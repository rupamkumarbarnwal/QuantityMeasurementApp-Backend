spring.application.name=quantity-measurment

# ?? Security ??????????????????????????????????????
# Removed - SecurityConfig.java handles this now

# ?? H2 Database ???????????????????????????????????
spring.datasource.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# ?? JPA / Hibernate ???????????????????????????????
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? H2 Console (Dev only) ?????????????????????????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ?? Swagger / OpenAPI ?????????????????????????????
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ?? Actuator ??????????????????????????????????????
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ?? Logging ???????????????????????????????????????
logging.level.com.app.quantityMeasurement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG