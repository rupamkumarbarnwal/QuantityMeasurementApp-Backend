# ── Application Configuration ─────────────────────────────────────────────────

app.name=QuantityMeasurementApp
app.version=1.0

# ── Repository Configuration ──────────────────────────────────────────────────
# Options: cache | database
app.repository.type=database

# ── H2 Database Configuration (Development) ───────────────────────────────────
db.driver=org.h2.Driver
db.url=jdbc:h2:./quantity_measurement_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

# ── MySQL Configuration (commented out - for future use) ──────────────────────
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/quantity_measurement_db?useSSL=false&serverTimezone=UTC
# db.username=root
# db.password=root

# ── PostgreSQL Configuration (commented out - for future use) ─────────────────
# db.driver=org.postgresql.Driver
# db.url=jdbc:postgresql://localhost:5432/quantity_measurement_db
# db.username=postgres
# db.password=postgres

# ── Connection Pool Configuration ─────────────────────────────────────────────
db.pool.size=10
db.pool.min.idle=2
db.pool.max.idle=5
db.pool.connection.timeout=30000
db.pool.idle.timeout=600000
db.pool.max.lifetime=1800000

# ── Schema Configuration ──────────────────────────────────────────────────────
db.schema.auto=true
db.schema.file=db/schema.sql

# ── Environment Configuration ─────────────────────────────────────────────────
# Options: development | production | test
app.environment=development

# ── Development Environment Overrides ─────────────────────────────────────────
dev.db.url=jdbc:h2:./quantity_measurement_dev_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
dev.db.username=sa
dev.db.password=

# ── Test Environment Overrides ────────────────────────────────────────────────
test.db.url=jdbc:h2:mem:quantity_measurement_test_db;DB_CLOSE_DELAY=-1
test.db.username=sa
test.db.password=

# ── Production Environment Overrides ──────────────────────────────────────────
# prod.db.url=jdbc:mysql://prod-server:3306/quantity_measurement_db
# prod.db.username=prod_user
# prod.db.password=prod_password

# ── Logging Configuration ─────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.app.quantitymeasurement=DEBUG
logging.file.name=logs/quantity-measurement-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n