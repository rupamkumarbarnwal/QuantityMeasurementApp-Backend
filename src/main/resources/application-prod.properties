spring.application.name=quantity-measurment

# ?? MySQL Database (Production) ???????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/quantity_measurement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password_here

# ?? JPA / Hibernate ???????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ?? H2 Console (Disabled in Production) ???????????
spring.h2.console.enabled=false

# ?? Swagger (Disabled in Production) ??????????????
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ?? Actuator ??????????????????????????????????????
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ?? Logging ???????????????????????????????????????
logging.level.root=WARN
logging.level.com.app.quantityMeasurement=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

