spring.application.name=quantity-measurment

# ?? MySQL Database ????????????????????????????????
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/quantitymeasurementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1473695

# ?? JPA / Hibernate ???????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? Swagger / OpenAPI ?????????????????????????????
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ?? Actuator ??????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ?? Logging ???????????????????????????????????????
logging.level.com.app.quantityMeasurement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG



